<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo Digital | Evaluación Web & Base de Datos</title>
    <!-- Bootstrap 5 CSS vía CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Estilos personalizados -->
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

    <!-- Encabezado semántico -->
    <header class="bg-dark text-white py-4 shadow-sm">
        <div class="container">
            <div class="d-flex justify-content-between align-items-center flex-wrap">
                <div>
                    <h1 class="h3 mb-1 fw-bold">NexusStore | Catálogo Interactivo</h1>
                    <p class="mb-0 text-secondary small">Consulta dinámica conectada a MySQL + Node.js/Express</p>
                </div>
                <span class="badge bg-primary fs-6" id="contador-resultados">Cargando...</span>
            </div>
        </div>
    </header>

    <!-- Contenido principal -->
    <main class="container my-4 flex-grow-1">
        
        <!-- Sección de controles y filtros DOM -->
        <section aria-label="Filtros de búsqueda" class="card shadow-sm border-0 mb-4">
            <div class="card-body">
                <div class="row g-3 align-items-end">
                    <!-- Filtro por texto -->
                    <div class="col-md-5">
                        <label for="buscador" class="form-label fw-semibold">Buscar por nombre o descripción</label>
                        <input type="text" id="buscador" class="form-control" placeholder="Ej: Baldur, Teclado, VR...">
                    </div>
                    <!-- Filtro por categoría -->
                    <div class="col-md-4">
                        <label for="filtro-categoria" class="form-label fw-semibold">Filtrar por categoría</label>
                        <select id="filtro-categoria" class="form-select">
                            <option value="todas">Todas las categorías</option>
                            <option value="RPG & Estrategia">RPG & Estrategia</option>
                            <option value="Hardware & Periféricos">Hardware & Periféricos</option>
                            <option value="Simulación & VR">Simulación & VR</option>
                        </select>
                    </div>
                    <!-- Botón limpiar -->
                    <div class="col-md-3 d-grid">
                        <button type="button" id="btn-limpiar" class="btn btn-outline-secondary">
                            Limpiar filtros
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Mensaje de alerta en caso de error de conexión con la API -->
        <div id="alerta-error" class="alert alert-danger d-none" role="alert"></div>

        <!-- Sección de grilla de resultados renderizados desde el DOM -->
        <section aria-label="Listado de productos">
            <div id="contenedor-productos" class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                <!-- Las tarjetas <article> se inyectan dinámicamente vía script.js -->
            </div>
        </section>

    </main>

    <!-- Pie de página semántico -->
    <footer class="bg-dark text-white text-center py-3 mt-auto">
        <div class="container">
            <small class="text-secondary">Proyecto Web con Acceso a Base de Datos — PUCV</small>
        </div>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Lógica de consumo de API y manipulación del DOM -->
    <script src="assets/js/script.js"></script>
</body>
</html>
